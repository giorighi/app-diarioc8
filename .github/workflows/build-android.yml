name: Build Signed Android App
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - run: npm install
      - run: npx cap sync android
      - name: Build Debug APK & Release AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease
      - name: Sign Release AAB
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          CLEAN_B64=$(printf "%s" "$KEYSTORE_BASE64" | tr -d ' \n\r')
          CLEAN_PASS=$(printf "%s" "$KEYSTORE_PASSWORD" | tr -d ' \n\r')
          CLEAN_KEYPASS=$(printf "%s" "${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" | tr -d ' \n\r')

          printf "%s" "$CLEAN_B64" | base64 -d > release.keystore
          REAL_ALIAS=$(keytool -list -keystore release.keystore -storepass "$CLEAN_PASS" | grep "PrivateKeyEntry" | head -n 1 | cut -d',' -f1)
          echo "Alias detectado: $REAL_ALIAS"

          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore release.keystore \
            -storepass "$CLEAN_PASS" \
            -keypass "$CLEAN_KEYPASS" \
            android/app/build/outputs/bundle/release/app-release.aab \
            "$REAL_ALIAS"
          rm -f release.keystore
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-diarioc8-signed-builds
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab
