name: Build Signed Android App
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - run: npm install
      - run: npx cap sync android
      - name: Build Debug APK & Release AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease
      - name: Sign Release AAB
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "ERRO: KEYSTORE_BASE64 vazio"; exit 1; fi
          if [ -z "$KEYSTORE_PASSWORD" ]; then echo "ERRO: KEYSTORE_PASSWORD vazio"; exit 1; fi
          if [ -z "$KEY_ALIAS" ]; then echo "ERRO: KEY_ALIAS vazio"; exit 1; fi
          printf "%s" "$KEYSTORE_BASE64" | tr -d ' \n\r' | base64 -d > release.keystore
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore release.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" \
            android/app/build/outputs/bundle/release/app-release.aab \
            "$KEY_ALIAS"
          rm -f release.keystore
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-diarioc8-signed-builds
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab
